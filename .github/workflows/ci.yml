name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version-file: '.nvmrc'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Typecheck
      run: npm run typecheck:admin && npm run typecheck:pdv

    - name: Lint
      run: npm run lint:pdv

    - name: Run Tests
      run: npm test

    # O pipeline so rodava typecheck e teste, entao um build quebrado passava
    # batido — inclusive o do PDV, que nem e publicado pela Vercel.
    - name: Build Admin
      run: npm run build:admin

    - name: Build PDV
      run: npm run build:pdv
